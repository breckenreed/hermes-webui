# Egress proxy for the Hermes agent — see docs/egress.md.
#
# This is not a content filter and makes no attempt to judge what the agent is
# doing. It answers one question: is this destination on the list the operator
# approved? Everything else is refused.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Info

# Who may use the proxy. The agent network is internal and holds nothing else,
# but stating it means a future container joining that network is a deliberate
# act rather than an accident.
Allow 0.0.0.0/0

# CONNECT is a raw TCP tunnel. Without this line the proxy would forward any
# port on an allow-listed host — SSH, a database, anything — which is a much
# larger hole than the allowlist implies.
ConnectPort 443

# The allowlist itself. FilterDefaultDeny is what makes it an allowlist rather
# than a blocklist: unlisted hosts are refused, so forgetting to add something
# fails visibly instead of silently permitting it.
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
# POSIX *extended* regex — `ere`, not `posix`, which tinyproxy rejects outright.
# (`FilterExtended On` is the older spelling; 1.11 warns it is deprecated, and a
# startup warning operators learn to ignore is worse than none.) The accepted
# values are bre | ere | fnmatch.
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
